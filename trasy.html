<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trasy — Szlaki Pienin</title>
<meta name="description" content="Wszystkie trasy z aplikacji Szlaki Pienin: długość, czas przejścia i przewyższenie.">
<link rel="stylesheet" href="styl.css">
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Kafelki tras. Osobno, a nie w styl.css, bo to jedyna strona, która ich
   używa — i jedyna, która czyta dane z aplikacji. */
.trasy { display: grid; gap: 1rem; grid-template-columns: 1fr; padding: 0; margin: 1.5rem 0 0; list-style: none; }
@media (min-width: 44rem) { .trasy { grid-template-columns: 1fr 1fr; } }

.trasa {
  background: var(--biala-karta);
  border: 1px solid var(--ramka);
  border-radius: 16px;
  overflow: hidden;
}
.trasa img { width: 100%; aspect-ratio: 420 / 260; object-fit: cover; display: block; background: var(--ramka); }
.trasa .tresc { padding: .9rem 1.05rem 1.05rem; }
.trasa h3 { margin: 0 0 .35rem; font-size: 1.02rem; }
.trasa .metryka { color: var(--tekst-slaby); font-size: .9rem; margin: 0; }
.trasa .odznaka {
  display: inline-block; margin-top: .5rem; padding: .15rem .5rem;
  border-radius: 6px; font-size: .78rem; font-weight: 600;
  background: rgba(46, 107, 79, .14); color: var(--zielen);
}
@media (prefers-color-scheme: dark) { .trasa .odznaka { color: #7fc4a2; } }

.filtry { display: flex; gap: .5rem; flex-wrap: wrap; margin: 1.5rem 0 0; }
.filtry button {
  font: inherit; font-size: .9rem; cursor: pointer;
  background: var(--biala-karta); color: var(--tekst);
  border: 1px solid var(--ramka); border-radius: 999px; padding: .35rem .85rem;
}
.filtry button[aria-pressed="true"] { background: var(--zielen); color: #fff; border-color: var(--zielen); }
</style>
</head>
<body>

<header>
  <div class="srodek">
    <h1>Trasy</h1>
    <p id="podsumowanie">Wczytuję…</p>
  </div>
</header>

<main class="srodek">
  <a class="powrot" href="index.html">← Strona główna</a>

  <p>
    Wszystkie trasy dostępne w aplikacji. Te same opisy, ilustracje i liczby —
    dane pochodzą wprost z aplikacji, więc nie da się im rozjechać.
  </p>

  <div class="filtry" id="filtry"></div>
  <ul class="trasy" id="lista"></ul>
</main>

<footer class="srodek">
  <nav>
    <a href="index.html">Strona główna</a>
    <a href="prywatnosc.html">Prywatność</a>
    <a href="wsparcie.html">Wsparcie</a>
  </nav>
</footer>

<script>
// Dane wczytujemy z `dane/`, czyli z kopii przyniesionej skryptem
// `narzedzia/synchronizuj-dane.sh`. Nazwy kategorii muszą się zgadzać
// z `Kategoria` w lib/data/models/trasa.dart.
const NAZWY_KATEGORII = {
  'krotka': 'Krótkie',
  'srednia': 'Średnie',
  'dluga': 'Długie',
  'niecodzienne': 'Niecodzienne',
  'trzy-korony': 'Trzy Korony',
  'dzieci': 'Z dziećmi',
  'rowerowa': 'Rowerowe',
  'korony-pienin': 'Korony Pienin',
  'wyzwania': 'Wyzwania',
};

const czas = (min) => {
  const h = Math.floor(min / 60), m = min % 60;
  if (h === 0) return `${m} min`;
  return m === 0 ? `${h} h` : `${h} h ${m} min`;
};

let wszystkie = [];
let wybrana = null;

function rysuj() {
  const lista = document.getElementById('lista');
  const widoczne = wybrana ? wszystkie.filter((t) => t.kategoria === wybrana) : wszystkie;
  lista.innerHTML = '';

  for (const t of widoczne) {
    const li = document.createElement('li');
    li.className = 'trasa';

    // Ilustracja bywa pusta — szczyty Korony Pienin czekają na rysunki.
    if (t.ilustracja) {
      const img = document.createElement('img');
      img.src = `dane/ilustracje/${t.ilustracja}`;
      img.alt = '';
      img.loading = 'lazy';
      li.append(img);
    }

    const tresc = document.createElement('div');
    tresc.className = 'tresc';

    const h3 = document.createElement('h3');
    h3.textContent = t.nazwa;
    tresc.append(h3);

    const p = document.createElement('p');
    p.className = 'metryka';
    const czesci = [`${t.dlugosc_km} km`, czas(t.czas_min_tam)];
    if (t.suma_podejsc_tam) czesci.push(`↑ ${t.suma_podejsc_tam} m`);
    p.textContent = czesci.join(' · ');
    tresc.append(p);

    if (t.pttk) {
      const s = document.createElement('span');
      s.className = 'odznaka';
      s.textContent = 'trasa PTTK';
      tresc.append(s);
    }

    li.append(tresc);
    lista.append(li);
  }
}

fetch('dane/trasy/index.json')
  .then((o) => o.json())
  .then((dane) => {
    wszystkie = Array.isArray(dane) ? dane : dane.trasy;
    document.getElementById('podsumowanie').textContent =
      `${wszystkie.length} tras przez Pieniny i Beskid Sądecki`;

    // Guziki kategorii budujemy z danych, nie z listy na sztywno — dzięki temu
    // nowa kategoria w aplikacji pojawia się tu sama.
    const kategorie = [...new Set(wszystkie.map((t) => t.kategoria))];
    const filtry = document.getElementById('filtry');

    const dodajGuzik = (id, etykieta) => {
      const b = document.createElement('button');
      b.textContent = etykieta;
      b.setAttribute('aria-pressed', String(wybrana === id));
      b.onclick = () => {
        wybrana = id;
        [...filtry.children].forEach((g) => g.setAttribute('aria-pressed', 'false'));
        b.setAttribute('aria-pressed', 'true');
        rysuj();
      };
      filtry.append(b);
    };

    dodajGuzik(null, 'Wszystkie');
    kategorie.forEach((k) => dodajGuzik(k, NAZWY_KATEGORII[k] || k));
    rysuj();
  })
  .catch(() => {
    document.getElementById('podsumowanie').textContent =
      'Nie udało się wczytać tras.';
    document.getElementById('lista').innerHTML =
      '<li class="trasa"><div class="tresc"><p class="metryka">' +
      'Brak katalogu <code>dane/</code>. Uruchom ' +
      '<code>./narzedzia/synchronizuj-dane.sh</code>.</p></div></li>';
  });
</script>

</body>
</html>
