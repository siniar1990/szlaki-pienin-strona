name: Zadania cykliczne

# Harmonogram działu aktualności.
#
# Dlaczego tutaj, a nie w vercel.json: darmowy plan Vercela dopuszcza wyłącznie
# zadania dobowe i tylko jedno na projekt. To jedno zajmuje już konserwacja
# statystyk tabliczek, a obchód źródeł ma chodzić co dwanaście godzin.
# Harmonogram GitHuba nie ma tych ograniczeń, jest darmowy dla repozytoriów
# publicznych i stoi obok kodu, którego dotyczy.
#
# Wymagane sekrety repozytorium (Settings → Secrets and variables → Actions):
#   ADRES_PORTALU  — np. https://szlakipienin.pl
#   SEKRET_ZADAN   — ta sama wartość co zmienna SEKRET_ZADAN na Vercelu

on:
  schedule:
    # Godziny w UTC. 5:20 i 17:20 czasu uniwersalnego to 7:20 i 19:20 latem
    # w Polsce — po porannej i po popołudniowej fali publikacji w lokalnych
    # serwisach. Nierówne minuty, bo o pełnych godzinach GitHub ma szczyt
    # i zadania potrafią się opóźnić o kilkanaście minut.
    - cron: '20 5,17 * * *'
    # Redakcja pisze notkę raz na dobę, po porannym obchodzie.
    - cron: '40 6 * * *'
  # Ręczne uruchomienie — do sprawdzenia świeżo dodanego źródła.
  workflow_dispatch:

jobs:
  obchod:
    # Poranny i wieczorny przebieg obchodu; przy uruchomieniu ręcznym też.
    if: github.event.schedule != '40 6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Obejdź źródła
        run: |
          kod=$(curl -sS -o /tmp/odpowiedz.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.SEKRET_ZADAN }}" \
            "${{ secrets.ADRES_PORTALU }}/api/cron/obchod")
          cat /tmp/odpowiedz.json
          echo

          # Kod inny niż 200 to awaria wywołania — zły sekret albo zły adres.
          test "$kod" = "200"

          # Ale kod 200 nie znaczy jeszcze, że obchód cokolwiek zrobił.
          # Zero odwiedzonych źródeł to awaria, o której trzeba wiedzieć,
          # a nie cisza, którą łatwo przeoczyć.
          odwiedzone=$(jq -r '.odwiedzone // 0' /tmp/odpowiedz.json)
          nowe=$(jq -r '.nowe // 0' /tmp/odpowiedz.json)
          bledy=$(jq -r '.bledy | length' /tmp/odpowiedz.json)
          echo "::notice::Odwiedzono $odwiedzone źródeł · nowych artykułów: $nowe · źródeł z błędem: $bledy"
          test "$odwiedzone" -gt 0

  redakcja:
    # `needs` razem z `always()`: przy uruchomieniu ręcznym redakcja czeka na
    # obchód, żeby wybierała spośród świeżo przyniesionych artykułów, a nie
    # równolegle z ich pobieraniem. Przy nocnym przebiegu obchód jest pomijany
    # i wtedy `always()` pozwala redakcji ruszyć mimo pominiętej zależności —
    # bez tego pominięty krok pociągnąłby ją za sobą.
    needs: [obchod]
    if: >-
      always() &&
      (github.event.schedule == '40 6 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Napisz notkę dnia
        run: |
          kod=$(curl -sS -o /tmp/odpowiedz.json -w '%{http_code}' \
            --max-time 300 \
            -H "Authorization: Bearer ${{ secrets.SEKRET_ZADAN }}" \
            "${{ secrets.ADRES_PORTALU }}/api/cron/redakcja")
          cat /tmp/odpowiedz.json
          echo

          test "$kod" = "200"

          # Najważniejsza część tego pliku. Redakcja odpowiada kodem 200 także
          # wtedy, gdy świadomie nic nie napisała — i wtedy, gdy się wywróciła.
          # Bez rozróżnienia stanów zielona zakładka Actions znaczyłaby
          # „poszło" również przy braku klucza albo błędzie modelu, czyli
          # dokładnie wtedy, gdy trzeba zareagować.
          stan=$(jq -r '.stan // "brak-odpowiedzi"' /tmp/odpowiedz.json)
          szczegoly=$(jq -r '.szczegoly // ""' /tmp/odpowiedz.json)

          case "$stan" in
            utworzono)
              ocena=$(jq -r '.ocena // "?"' /tmp/odpowiedz.json)
              echo "::notice::Szkic notki czeka w panelu · ocena wyboru $ocena/100"
              ;;
            nic-nie-warte|brak-kandydatow|za-wczesnie)
              # To są zamierzone wyniki, nie awarie. Dzień bez wiadomości
              # jest w tym projekcie decyzją, a nie usterką.
              echo "::notice::Redakcja nic nie napisała ($stan). $szczegoly"
              ;;
            *)
              echo "::error::Redakcja zgłosiła problem ($stan). $szczegoly"
              exit 1
              ;;
          esac
